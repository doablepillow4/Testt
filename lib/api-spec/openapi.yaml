openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SolBubble market and on-chain intelligence API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tokens
    description: Solana token discovery and intelligence
  - name: wallets
    description: Wallet holdings and activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tokens/search:
    get:
      operationId: searchTokens
      tags: [tokens]
      summary: Search Solana tokens and pairs
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching token markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenSearchResult"
        "400":
          description: Invalid search
  /tokens/{mint}:
    get:
      operationId: getToken
      tags: [tokens]
      summary: Get market and metadata for a token
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: Token detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDetail"
        "404":
          description: Token not found
  /tokens/{mint}/holders:
    get:
      operationId: getTokenHolders
      tags: [tokens]
      summary: Get the largest token holders
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: Holder concentration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldersResponse"
  /tokens/{mint}/buyers:
    get:
      operationId: getTokenEarlyBuyers
      tags: [tokens]
      summary: Get wallets that first acquired a token
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: Earliest detected buyers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyBuyersResponse"
  /tokens/{mint}/holder-risk:
    get:
      operationId: getTokenHolderRisk
      tags: [tokens]
      summary: Score the token's holder distribution risk
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: Holder distribution risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolderDistributionRiskResponse"
  /tokens/{mint}/risk:
    get:
      operationId: getTokenRisk
      tags: [tokens]
      summary: Combine holder, buyer, coordination, liquidity, and completeness signals into a risk score
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: Unified token risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRiskResponse"
  /tokens/{mint}/coordinated-wallets:
    get:
      operationId: getCoordinatedWallets
      tags: [tokens]
      summary: Detect likely coordinated wallet activity
      parameters:
        - $ref: "#/components/parameters/Mint"
      responses:
        "200":
          description: Coordinated-wallet risk signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinatedWalletsResponse"
  /wallets/{address}:
    get:
      operationId: getWalletProfile
      tags: [wallets]
      summary: Get holdings and recent activity for a wallet
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Wallet profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletProfile"
components:
  parameters:
    Mint:
      name: mint
      in: path
      required: true
      schema:
        type: string
        minLength: 32
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TokenSearchResult:
      type: object
      required: [mint, name, symbol, priceUsd, liquidityUsd, volume24hUsd, change24h, marketCap, fdv, dexId, pairAddress, url]
      properties:
        mint: { type: string }
        name: { type: string }
        symbol: { type: string }
        imageUrl: { type: ["string", "null"] }
        priceUsd: { type: ["number", "null"] }
        liquidityUsd: { type: ["number", "null"] }
        volume24hUsd: { type: ["number", "null"] }
        change24h: { type: ["number", "null"] }
        marketCap: { type: ["number", "null"] }
        fdv: { type: ["number", "null"] }
        dexId: { type: string }
        pairAddress: { type: string }
        url: { type: string }
    TokenDetail:
      type: object
      required: [mint, name, symbol, priceUsd, liquidityUsd, volume24hUsd, change24h, marketCap, fdv, dexId, pairAddress, url, ageSeconds, launchTimestamp]
      properties:
        mint: { type: string }
        name: { type: string }
        symbol: { type: string }
        imageUrl: { type: ["string", "null"] }
        priceUsd: { type: ["number", "null"] }
        liquidityUsd: { type: ["number", "null"] }
        volume24hUsd: { type: ["number", "null"] }
        change24h: { type: ["number", "null"] }
        marketCap: { type: ["number", "null"] }
        fdv: { type: ["number", "null"] }
        dexId: { type: string }
        pairAddress: { type: string }
        url: { type: string }
        ageSeconds: { type: ["number", "null"] }
        launchTimestamp: { type: ["string", "null"], format: date-time }
        website: { type: ["string", "null"] }
        twitter: { type: ["string", "null"] }
        telegram: { type: ["string", "null"] }
        chart: 
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
    ChartPoint:
      type: object
      required: [timestamp, price]
      properties:
        timestamp: { type: number }
        price: { type: number }
    Holder:
      type: object
      required: [rank, address, amount, percentage]
      properties:
        rank: { type: number }
        address: { type: string }
        amount: { type: number }
        percentage: { type: number }
        tokenAccount: { type: ["string", "null"] }
    HoldersResponse:
      type: object
      required: [holders, top10Concentration, top20Concentration, totalSupply, decimals, holderCount, fetchedAt]
      properties:
        holders:
          type: array
          items:
            $ref: "#/components/schemas/Holder"
        top10Concentration: { type: number }
        top20Concentration: { type: number }
        totalSupply: { type: number }
        decimals: { type: number }
        holderCount: { type: number }
        fetchedAt: { type: string, format: date-time }
    EarlyBuyer:
      type: object
      required: [position, address, approximateTimeAfterLaunch, timestamp, amountBought, amountSolSpent, currentBalance, totalBought, totalSold, remainingPercent, averageEntry, averageExit, realizedPnl, unrealizedPnl, return, status, holdingStatus, dataCompleteness]
      properties:
        position: { type: number }
        address: { type: string }
        approximateTimeAfterLaunch: { type: ["string", "null"] }
        timestamp: { type: ["string", "null"], format: date-time }
        amountBought: { type: ["number", "null"] }
        amountSolSpent: { type: ["number", "null"] }
        currentBalance: { type: ["number", "null"] }
        totalBought: { type: ["number", "null"] }
        totalSold: { type: ["number", "null"] }
        remainingPercent: { type: ["number", "null"] }
        averageEntry: { type: ["number", "null"] }
        averageExit: { type: ["number", "null"] }
        realizedPnl: { type: ["number", "null"] }
        unrealizedPnl: { type: ["number", "null"] }
        return: { type: ["number", "null"] }
        status:
          type: string
          enum: [holding, sold, unknown]
        holdingStatus:
          type: string
          enum: [holding, sold, unknown]
        dataCompleteness:
          type: string
          enum: [complete, partial, unknown]
    EarlyBuyersResponse:
      type: object
      required: [buyers, scannedTransactions, fetchedAt]
      properties:
        buyers:
          type: array
          items:
            $ref: "#/components/schemas/EarlyBuyer"
        scannedTransactions: { type: number }
        fetchedAt: { type: string, format: date-time }
    HolderDistributionRiskResponse:
      type: object
      required: [mint, riskLevel, riskScore, top10Concentration, top20Concentration, maxHolderShare, holderCount, excludedLikelyInfrastructure, liquidityUsd, reasons, dataCompleteness, fetchedAt]
      properties:
        mint: { type: string }
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        riskScore: { type: number }
        top10Concentration: { type: number }
        top20Concentration: { type: number }
        maxHolderShare: { type: number }
        holderCount: { type: number }
        excludedLikelyInfrastructure: { type: number }
        liquidityUsd: { type: ["number", "null"] }
        reasons:
          type: array
          items:
            type: string
        dataCompleteness:
          type: string
          enum: [complete, partial, unknown]
        fetchedAt: { type: string, format: date-time }
    CoordinatedWalletSignal:
      type: object
      required: [type, strength, summary]
      properties:
        type:
          type: string
          enum: [funding-source, same-tx, temporal, similar-size, sell-sync, co-occurrence]
        strength: { type: number }
        summary: { type: string }
    CoordinatedWalletSummary:
      type: object
      required: [wallet, buyVolume, sellVolume, firstSeen, lastSeen, supplyShare]
      properties:
        wallet: { type: string }
        buyVolume: { type: number }
        sellVolume: { type: number }
        firstSeen: { type: ["string", "null"], format: date-time }
        lastSeen: { type: ["string", "null"], format: date-time }
        supplyShare: { type: number }
    CoordinatedWalletCluster:
      type: object
      required: [clusterId, wallets, confidence, reasons, signals, activityStart, activityEnd, supplyShare, dataCompleteness]
      properties:
        clusterId: { type: string }
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/CoordinatedWalletSummary"
        confidence: { type: number }
        reasons:
          type: array
          items:
            type: string
        signals:
          type: array
          items:
            $ref: "#/components/schemas/CoordinatedWalletSignal"
        activityStart: { type: ["string", "null"], format: date-time }
        activityEnd: { type: ["string", "null"], format: date-time }
        supplyShare: { type: number }
        dataCompleteness:
          type: string
          enum: [complete, partial, unknown]
    CoordinatedWalletsResponse:
      type: object
      required: [mint, clusters, scannedTransactions, fetchedAt, dataCompleteness]
      properties:
        mint: { type: string }
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/CoordinatedWalletCluster"
        scannedTransactions: { type: number }
        fetchedAt: { type: string, format: date-time }
        dataCompleteness:
          type: string
          enum: [complete, partial, unknown]
    TokenRiskComponentScore:
      type: object
      required: [score, severity]
      properties:
        score: { type: ["number", "null"] }
        severity:
          type: ["string", "null"]
          enum: [low, medium, high, critical, null]
    TokenRiskResponse:
      type: object
      required: [mint, riskScore, severity, componentScores, reasons, warnings, dataCompleteness, fetchedAt]
      properties:
        mint: { type: string }
        riskScore: { type: number }
        severity:
          type: string
          enum: [low, medium, high, critical]
        componentScores:
          type: object
          required: [holderConcentration, earlyBuyers, coordinatedWallets, liquidity, dataCompleteness]
          properties:
            holderConcentration: { $ref: "#/components/schemas/TokenRiskComponentScore" }
            earlyBuyers: { $ref: "#/components/schemas/TokenRiskComponentScore" }
            coordinatedWallets: { $ref: "#/components/schemas/TokenRiskComponentScore" }
            liquidity: { $ref: "#/components/schemas/TokenRiskComponentScore" }
            dataCompleteness: { $ref: "#/components/schemas/TokenRiskComponentScore" }
        reasons:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        dataCompleteness:
          type: string
          enum: [complete, partial, unknown]
        fetchedAt: { type: string, format: date-time }
    WalletAsset:
      type: object
      required: [id, name, symbol, amount, decimals]
      properties:
        id: { type: string }
        name: { type: string }
        symbol: { type: string }
        imageUrl: { type: ["string", "null"] }
        amount: { type: number }
        decimals: { type: number }
        valueUsd: { type: ["number", "null"] }
    WalletActivity:
      type: object
      required: [signature, timestamp, type, description]
      properties:
        signature: { type: string }
        timestamp: { type: ["string", "null"], format: date-time }
        type: { type: string }
        description: { type: string }
        source: { type: ["string", "null"] }
    WalletProfile:
      type: object
      required: [address, assets, activity, tokenCount, walletAge, firstSeen, fetchedAt]
      properties:
        address: { type: string }
        assets:
          type: array
          items:
            $ref: "#/components/schemas/WalletAsset"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/WalletActivity"
        tokenCount: { type: number }
        walletAge: { type: ["string", "null"] }
        firstSeen: { type: ["string", "null"], format: date-time }
        fetchedAt: { type: string, format: date-time }

